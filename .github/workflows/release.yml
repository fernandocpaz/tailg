name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64, ext: ''}
          - {goos: linux, goarch: arm64, ext: ''}
          - {goos: windows, goarch: amd64, ext: '.exe'}
          - {goos: windows, goarch: arm64, ext: '.exe'}
          - {goos: darwin, goarch: amd64, ext: ''}
          - {goos: darwin, goarch: arm64, ext: ''}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          output="dist/tailg_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w -X github.com/fernandocpaz/tailg/internal/app.Version=${{ github.ref_name }}" -o "$output" ./cmd/tailg
      - uses: actions/upload-artifact@v4
        with:
          name: tailg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tailg-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

