name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/RELEASE']

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(tr -d '[:space:]' < .github/RELEASE)"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64, ext: ''}
          - {goos: linux, goarch: arm64, ext: ''}
          - {goos: windows, goarch: amd64, ext: '.exe'}
          - {goos: windows, goarch: arm64, ext: '.exe'}
          - {goos: darwin, goarch: amd64, ext: ''}
          - {goos: darwin, goarch: arm64, ext: ''}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          output="dist/tailg_${{ needs.metadata.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          commit="$(git rev-parse HEAD)"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags="-s -w -X github.com/fernandocpaz/tailg/internal/app.Version=${{ needs.metadata.outputs.version }} -X github.com/fernandocpaz/tailg/internal/app.Commit=$commit -X github.com/fernandocpaz/tailg/internal/app.BuildTime=$build_time" -o "$output" ./cmd/tailg
      - uses: actions/upload-artifact@v4
        with:
          name: tailg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tailg-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
